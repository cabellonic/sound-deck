[package]
name = "sound-deck"
version = "1.0.1"
description = "Soundboard de escritorio con overlay, biblioteca local y busqueda online"
authors = ["Sound Deck"]
edition = "2021"
rust-version = "1.87"
license = "MIT"
default-run = "sound-deck"

[lib]
name = "sound_deck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Persistencia: rusqlite con SQLite embebido (bundled), sin depender de la libreria del sistema.
rusqlite = { version = "0.40", features = ["bundled"] }

# Audio. cpal se usa a traves del re-export `rodio::cpal` para garantizar la misma version.
rodio = { version = "0.22", default-features = false, features = [
  "playback",
  "mp3",
  "vorbis",
  "flac",
  "wav",
] }

# Red
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "json",
  "stream",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "time", "sync"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
async-trait = "0.1"

# Parseo HTML para los proveedores sin API (solo MyInstants, §12).
scraper = { version = "0.27", default-features = false }

# Utilidades
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
sha2 = "0.11"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
parking_lot = "0.12"
dunce = "1"
ebur128 = { version = "0.1", default-features = false }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
] }

[dev-dependencies]
tempfile = "3"
tiny_http = "0.12"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
