name: Release

# Se dispara al empujar una etiqueta `vX.Y.Z`.
on:
  push:
    tags: ['v*']

# Para crear la release y subir los binarios.
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Detectar el desajuste antes de compilar veinte minutos.
  verificar-version:
    name: Verificar version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: La etiqueta tiene que coincidir con la version del proyecto
        run: |
          tag="${GITHUB_REF_NAME#v}"
          conf=$(jq -r .version src-tauri/tauri.conf.json)
          pkg=$(jq -r .version package.json)

          echo "etiqueta        : $tag"
          echo "tauri.conf.json : $conf"
          echo "package.json    : $pkg"

          if [ "$tag" != "$conf" ] || [ "$tag" != "$pkg" ]; then
            echo "::error::La etiqueta v$tag no coincide con la version del proyecto." \
                 "Actualiza package.json y src-tauri/tauri.conf.json, o corregi la etiqueta."
            exit 1
          fi

  build:
    name: Build (${{ matrix.os }})
    needs: verificar-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # El binario queda atado a la glibc del runner: compilar en la
          # version mas vieja disponible amplia donde instala el .deb.
          - os: ubuntu-22.04
          - os: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Dependencias de sistema de Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Compilar y publicar los artefactos
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # linuxdeploy necesita FUSE, que en un runner no hay.
          APPIMAGE_EXTRACT_AND_RUN: 1
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Sound Deck ${{ github.ref_name }}
          releaseBody: |
            Instaladores de Sound Deck ${{ github.ref_name }}.

            - **Windows**: descarga el `.exe` (instalador NSIS, se instala por usuario y no pide permisos de administrador).
            - **Linux**: el `.deb` para Debian y Ubuntu, o el `.AppImage` si tu distribucion es otra.

            Los instaladores no estan firmados digitalmente, asi que Windows va a
            mostrar un aviso de SmartScreen la primera vez: "Mas informacion" y
            "Ejecutar de todas formas".
          # Borrador: permite revisar que subieron los artefactos de ambos
          # sistemas antes de que la release sea visible.
          releaseDraft: true
          prerelease: false
