name: Dependabot auto-merge

# Mergea las actualizaciones menores y de parche cuando CI pasa. Las mayores
# quedan para revisar a mano.
#
# Requiere checks obligatorios en `main`: `--auto` mergea cuando se cumplen los
# requisitos, y sin requisitos se cumple al instante.
on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      # Este workflow no hace checkout: `pull_request_target` corre con el token
      # del repositorio, y ejecutar codigo del PR con ese token seria un agujero.
      - uses: dependabot/fetch-metadata@v2
        id: meta

      - if: steps.meta.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
