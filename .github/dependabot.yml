version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Agrupar lo menor deja un PR por semana en vez de uno por dependencia.
    # Lo mayor viene suelto a proposito: es lo que puede romper.
    groups:
      frontend:
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    groups:
      rust:
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # Aca se agrupa tambien lo mayor: subir de `checkout@v4` a `v5` no cambia
    # como se usa la accion.
    groups:
      acciones:
        patterns: ['*']
        update-types: [major, minor, patch]
