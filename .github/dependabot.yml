version: 2

# Dependabot abre pull requests con las actualizaciones de dependencias. Como CI
# corre en cada PR, cada actualizacion llega ya probada: si rompe algo, se ve en
# el PR y no en tu maquina un mes despues.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Sin esto llegan diez PRs sueltos por semana. Agrupar las actualizaciones
    # menores deja uno solo, que es revisable.
    groups:
      frontend:
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    groups:
      rust:
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  # Las propias acciones de los workflows tambien envejecen, y son las que
  # tienen acceso al token que publica las releases.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # Aca se agrupa tambien lo mayor. Subir de `checkout@v4` a `v5` no cambia
    # como se usa la accion, y revisar cuatro PRs de una linea cada uno es ruido
    # sin nada a cambio. Si alguna rompe, CI lo dice en el mismo PR agrupado.
    groups:
      acciones:
        patterns: ['*']
        update-types: [major, minor, patch]
